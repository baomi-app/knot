name: Knot
options:
  bundleIdPrefix: app.baomi
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.9"
    CURRENT_PROJECT_VERSION: "18"
    CODE_SIGN_STYLE: Automatic
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Knot:
    type: application
    platform: macOS
    sources:
      - path: Knot
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: docs/licenses/Sparkle.txt
        buildPhase: resources
    dependencies:
      - package: Sparkle
    info:
      path: Knot/Info.plist
      properties:
        CFBundleDisplayName: Knot
        CFBundleName: Knot
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHighResolutionCapable: true
        NSScreenCaptureUsageDescription: Knot uses screen capture only when you run a capture command.
        NSHumanReadableCopyright: Copyright © 2026 baomi.app. All rights reserved.
        SUFeedURL: https://github.com/baomi-app/knot/releases/latest/download/appcast.xml
        SUPublicEDKey: jTqyXCId+m6cJUO/vy10QZ/7JwV1q5hXZ9myy6prK8Y=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUEnableSystemProfiling: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.baomi.knot
        PRODUCT_NAME: Knot
        SWIFT_OBJC_BRIDGING_HEADER: Knot/Knot-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ONLY_ACTIVE_ARCH: false
    entitlements:
      path: Knot/Knot.entitlements
      properties:
        com.apple.security.app-sandbox: false
  KnotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KnotTests
      - path: Knot/Calculator.swift
      - path: Knot/Quicklink.swift
      - path: Knot/QuicklinkStore.swift
      - path: Knot/CommandPanelKeyCommand.swift
      - path: Knot/KnotBarVisibilityPolicy.swift
      - path: Knot/KnotBarUpdateScheduler.swift
      - path: Knot/UpdateConfiguration.swift
      - path: Knot/UpdateFeedAvailability.swift
      - path: Knot/ScannedApplication.swift
      - path: Knot/AppScanner.swift
      - path: Knot/ApplicationIndex.swift
      - path: Knot/ApplicationDirectoryMonitor.swift
      - path: Knot/ClipboardHistoryStore.swift
      - path: Knot/ClipboardSettingsStore.swift
      - path: Knot/ClipboardMonitor.swift
      - path: Knot/PopClipboardService.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
